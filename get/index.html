<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get CrateWise Beta</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 60px 24px; color: #FFFFFF; background: #0B0F0E; line-height: 1.6; text-align: center; }
  h1 { color: #629AA9; font-size: 22px; margin-bottom: 8px; }
  p { color: rgba(255,255,255,0.7); font-size: 15px; }
  a.btn { display: block; margin: 20px 0; padding: 16px; border-radius: 12px; background: #629AA9; color: #06181C; font-weight: 700; text-decoration: none; font-size: 16px; }
  a.btn.secondary { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #FFFFFF; }
</style>
</head>
<body>
  <h1>CrateWise Beta</h1>
  <p id="msg">Redirecting you to the right store for your device…</p>
  <a class="btn" href="https://testflight.apple.com/join/cJgX3hCw">iPhone — Join via TestFlight</a>
  <div id="android-steps" style="display:none; text-align:left;">
    <p style="margin-bottom:4px;">Android needs one extra step first:</p>
    <a class="btn secondary" href="https://groups.google.com/g/cratewise-beta-testers">1. Join the Google Group</a>
    <a class="btn secondary" href="https://play.google.com/apps/testing/com.topdonn.cratewise">2. Then tap here to become a tester</a>
  </div>
  <script>
    // iOS: auto-redirect straight to TestFlight (no prerequisite).
    // Android: do NOT auto-redirect — testers must join the Google Group
    // before the Play opt-in link will work for them, so show both steps
    // instead of silently forwarding into a broken/ineligible page.
    var ua = navigator.userAgent || '';
    var IOS_URL = 'https://testflight.apple.com/join/cJgX3hCw';
    if (/iPhone|iPad|iPod/i.test(ua)) {
      location.replace(IOS_URL);
    } else if (/Android/i.test(ua)) {
      document.getElementById('msg').textContent = "You're on Android — follow both steps below:";
      document.getElementById('android-steps').style.display = 'block';
    }
    // Anything else (desktop, unknown UA) — stay on this page, show both paths.
  </script>
</body>
</html>
